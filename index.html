<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#831843" />
    <meta name="description" content="Trang thông tin chính thức của Giáo Xứ Hoàng Yên." />
    <!-- Cấu hình hiển thị dạng App cho iPhone/iPad (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Giáo Xứ Hoàng Yên</title>
  </head>
  <body>
    <script>
      // Xóa bỏ Service Worker/Cache rác cũ nếu có (Tránh lỗi cache trang trắng cho người dùng)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) { registration.unregister(); }
        });
      }
    </script>
    <div id="root">
      <!-- Màn hình chào (Splash Screen) sẽ hiển thị trong lúc chờ tải React -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #831843; color: white; font-family: serif;">
        <img src="/logo192.png" alt="Logo" style="width: 120px; height: 120px; border-radius: 50%; border: 4px solid white; box-shadow: 0 8px 16px rgba(0,0,0,0.3); margin-bottom: 24px; animation: splashPulse 2s infinite ease-in-out;" />
        <h1 style="font-size: 24px; font-weight: bold; margin: 0; text-transform: uppercase; letter-spacing: 2px;">Giáo Xứ Hoàng Yên</h1>
        <p style="font-size: 10px; opacity: 0.7; margin-top: 12px; text-transform: uppercase; letter-spacing: 4px;">Đang khởi động...</p>
      </div>
      <style>
        body { margin: 0; padding: 0; background-color: #831843; }
        @keyframes splashPulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } 100% { transform: scale(1); opacity: 1; } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
